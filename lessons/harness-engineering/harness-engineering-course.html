    'Cái gì chứng minh completion? — model claim, deterministic validator, external state, evaluator, human.',
    'Run dừng thế nào nếu mãi không thành công? — turn/time/token/tool/cost/policy budgets.',
    'Sau gián đoạn thì sao? — resume, retry, reprovision, rollback, restart.',
    'Observation không tin cậy có mang instruction được không? — web data, tool output, files, memory, loaded skills, subagent reports.',
    'Subagents được coordinate thế nào? — task boundaries, shared state, merge policy, concurrency limits.',
    'Harness được evaluate thế nào? — ablations, representative tasks, stable environments, outcome metrics.',
  ];
  return `
  <h1>Bảng tra cứu nhanh</h1>
  <p class="muted">Cheat sheet dùng khi thiết kế, review hoặc debug một agent system.</p>

  <div class="accItem open"><div class="accHead">⚠️ 13 failure modes thường gặp <span class="chev">›</span></div>
    <div class="accBody">
      <table class="failTable"><tr><th>Loại</th><th>Mô tả</th></tr>
      ${fails.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td></tr>`).join('')}
      </table>
    </div>
  </div>

  <div class="accItem"><div class="accHead">🚫 12 ngộ nhận phổ biến (bấm để xem) <span class="chev">›</span></div>
    <div class="accBody">
      <div class="mis">
        <div class="misRow"><div class="q">"Harness là system prompt."</div><div class="a"><b>Không.</b> Instruction chỉ là một phần; harness còn sở hữu state, tool dispatch, approvals, compaction, recovery, budgets, verification.</div></div>
        <div class="misRow"><div class="q">"Harness là sandbox."</div><div class="a"><b>Không.</b> Harness điều khiển công việc; sandbox chỉ là một nơi công việc chạy.</div></div>
        <div class="misRow"><div class="q">"MCP là agent."</div><div class="a"><b>Không.</b> MCP chuẩn hóa capability surfaces; loop & policies vẫn cần orchestration riêng.</div></div>
        <div class="misRow"><div class="q">"Context window = memory."</div><div class="a"><b>Không.</b> Durable state có thể nằm ngoài context hiện tại.</div></div>
        <div class="misRow"><div class="q">"Compaction giữ nguyên hội thoại."</div><div class="a"><b>Không.</b> Summary là lossy trừ khi thông tin bỏ đi còn recoverable chỗ khác.</div></div>
        <div class="misRow"><div class="q">"Càng nhiều tool càng tốt."</div><div class="a"><b>Không.</b> Overlap + kết quả nhiễu làm selection & reasoning khó hơn.</div></div>
        <div class="misRow"><div class="q">"Có approval là chạy gì cũng an toàn."</div><div class="a"><b>Không.</b> Approval và containment giải quyết hai bài toán khác nhau.</div></div>
        <div class="misRow"><div class="q">"Tool fail thì cứ retry."</div><div class="a"><b>Không tự động.</b> Side-effecting ops có thể cần idempotency/dedup semantics.</div></div>
        <div class="misRow"><div class="q">"Agent nói xong là xong."</div><div class="a"><b>Không.</b> Self-report yếu hơn observable verification.</div></div>
        <div class="misRow"><div class="q">"Nhiều agent hơn là tốt hơn."</div><div class="a"><b>Không phổ quát.</b> Coordination cost có thể lấn át trên công việc tuần tự chặt.</div></div>
        <div class="misRow"><div class="q">"Model tốt hơn → mọi cải tiến harness cũ vẫn hữu ích."</div><div class="a"><b>Không.</b> Scaffolding có thể thành dead weight khi hành vi model đổi.</div></div>
        <div class="misRow"><div class="q">"Skill chỉ là prompt template vô hại."</div><div class="a"><b>Không.</b> Chứa instruction + resources + scripts; phải coi như third-party code.</div></div>
      </div>
    </div>
  </div>

  <div class="accItem"><div class="accHead">📋 15 câu hỏi kiểm tra hệ agent production <span class="chev">›</span></div>
    <div class="accBody"><ol class="q15">${q15.map(x=>`<li>${x}</li>`).join('')}</ol></div>
  </div>

  <div class="accItem"><div class="accHead">📖 Về tài liệu gốc <span class="chev">›</span></div>
    <div class="accBody">
      ${REFS.map(r=>`<h3 style="margin-top:6px">${r.title}</h3>${r.content}`).join('')}
    </div>
  </div>

  <div class="keybox"><div class="lbl">Mẹo dùng</div>
    <div class="txt">In trang này (hoặc bấm ⬇ PDF trên thanh tiêu đề) để có bản offline. Ctrl+P = in toàn bộ khóa học; nút ⬇ PDF xuất đầy đủ 43 mục.</div>
  </div>`;
}

/* =========================================================
   BIND / EVENTS
   ========================================================= */
function bindView(){
  const v=document.getElementById('view');
  v.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{
    const g=el.dataset.go;
    if(g.startsWith('sec:')) openSection(g.slice(4));
    else if(g==='quiz'){ setTab('quiz'); current.view='quiz'; render(); }
  }));
  v.querySelectorAll('[data-sec]').forEach(el=>el.addEventListener('click',()=>openSection(el.dataset.sec)));
  v.querySelectorAll('[data-part]').forEach(el=>el.addEventListener('click',()=>openPart(el.dataset.part)));
  v.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.toggle;
    if(done.has(id)){ done.delete(id); toast('Đã bỏ đánh dấu'); } else { done.add(id); toast('✅ Đã học xong mục này!'); }
    saveProg(); render();
  }));
  // quiz binds
  v.querySelectorAll('[data-quiz]').forEach(el=>el.addEventListener('click',()=>{
    const a=el.dataset.quiz;
    if(a==='start'||a==='restart') quizStart();
    else if(a==='next') quizNext();
  }));
  v.querySelectorAll('.qopt').forEach(el=>el.addEventListener('click',()=>quizAnswer(parseInt(el.dataset.qi,10))));
  // cards binds
  document.getElementById('fcard')?.addEventListener('click',cardFlip);
  v.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{
    const a=el.dataset.card;
    if(a==='next'){cardMove(1);return;} if(a==='prev'){cardMove(-1);return;}
    if(a==='known'){cardToggleKnown();return;} if(a==='shuffle'){cardShuffle();return;}
    if(a==='filter-known'){cardFilter('known');return;} if(a==='filter-unknown'){cardFilter('unknown');return;}
  }));
  // accordions (ref)
  v.querySelectorAll('.accHead').forEach(el=>el.addEventListener('click',()=>el.parentElement.classList.toggle('open')));
}

function setTab(view){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const view=t.dataset.view;
  if(view==='learn'){ current={view:current.view==='part'?'part':'learn', part:current.part, sec:current.sec||'s0'}; }
  else current.view=view;
  setTab(view); render(); window.scrollTo({top:0});
}));
document.getElementById('brandBtn').addEventListener('click',()=>{ current.view='home'; setTab('home'); render(); window.scrollTo({top:0}); });
document.getElementById('menuBtn').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('show');
});
document.getElementById('scrim').addEventListener('click',closeSidebar);
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=cur;
  try{ localStorage.setItem(LS_THEME,cur); }catch(e){}
  toast(cur==='dark'?'🌙 Chế độ tối':'☀️ Chế độ sáng');
});
document.addEventListener('keydown',e=>{
  if(current.view!=='learn') return;
  const ids=Object.keys(SECTIONS); const idx=ids.indexOf(current.sec);
  if(e.key==='ArrowRight'&&idx<ids.length-1) openSection(ids[idx+1]);
  if(e.key==='ArrowLeft'&&idx>0) openSection(ids[idx-1]);
});

/* ---------- FLOWS (design.html) ---------- */
document.getElementById('flowsBtn').addEventListener('click',()=>window.open('design.html','_blank'));

/* ---------- EXPORT PDF ---------- */
document.getElementById('printBtn').addEventListener('click',()=>{
  const root=document.createElement('div'); root.className='print-root';
  let h=`<h1>Understanding Harness Engineering</h1>
  <p class="muted">Khóa học tương tác — bản in đầy đủ 43 mục. Nguồn: handbook của @techNmak (Understanding AI Series); ghi chú học tập tiếng Việt.</p>`;
  for(const p of PARTS){
    h+=`<div class="ppart">Phần ${p.num} — ${p.title}</div>`;
    for(const sid of p.sections){
      const s=SECTIONS[sid];
      h+=`<div class="psec"><h2>${s.n==='0'?'':'Mục '+s.n+' — '}${s.t}</h2><div class="muted small">${s.en}</div>${s.body}
      <div class="keybox"><div class="lbl">Điểm mấu chốt</div><div class="txt">${s.key}</div></div></div>`;
    }
  }
  root.innerHTML=h;
  document.body.appendChild(root);
  document.body.classList.add('printing');
  window.print();
  setTimeout(()=>{ root.remove(); document.body.classList.remove('printing'); },400);
});

/* ---------- INIT ---------- */
updateProgress();
render();
</script>
