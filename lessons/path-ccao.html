const store = {
  read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
  write(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
};

let progress = store.read();
const root = document.getElementById('stages');

function unlocked(id) {
  return id === 1 || !!(progress[id - 1] && progress[id - 1].passed);
}

function render() {
  root.innerHTML = '';
  let done = 0;
  stages.forEach(st => {
    const state = progress[st.id];
    const open = unlocked(st.id);
    if (state && state.passed) done++;

    const card = document.createElement('section');
    card.className = 'stage' + (open ? '' : ' locked') + (state && state.passed ? ' done' : '');
    card.innerHTML = `
      <div class="stage-head">
        <h3>${st.title}</h3>
        <span class="badge">${state && state.passed ? 'đã qua · ' + state.score + '/5' : open ? 'đang mở' : 'khóa'}</span>
      </div>
      <p class="score">${st.recap} <a href="ccao-f.html#${st.anchor}">Đọc bài</a></p>
      <div class="quiz"></div>`;

    if (open) card.querySelector('.quiz').appendChild(buildQuiz(st));
    else card.querySelector('.quiz').innerHTML = '<p class="score">Hoàn thành chặng ' + (st.id - 1) + ' để mở.</p>';
    root.appendChild(card);
  });

  updateTop();
}

function updateTop() {
  let done = 0;
  stages.forEach(st => { const s = progress[st.id]; if (s && s.passed) done++; });
  document.getElementById('progressText').textContent = done + ' / 12 chặng';
  document.getElementById('bar').style.width = Math.round(done / 12 * 100) + '%';
  document.getElementById('hint').textContent = done === 12
    ? 'Xong cả 12 chặng. Làm đề 60 câu tiếp theo.'
    : 'Đang ở chặng ' + Math.min(done + 1, 12) + '.';
}

function buildQuiz(st) {
  const wrap = document.createElement('div');
  const saved = progress[st.id];

  st.qs.forEach((item, qi) => {
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = (qi + 1) + '. ' + item.q;
    wrap.appendChild(q);

    const opts = document.createElement('div');
    opts.className = 'opts';
    item.o.forEach((text, oi) => {
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML = `<input type="radio" name="s${st.id}q${qi}" value="${oi}"><span>${text}</span>`;
      opts.appendChild(label);
    });
    wrap.appendChild(opts);

    const why = document.createElement('p');
    why.className = 'why';
    why.textContent = item.why;
    wrap.appendChild(why);
  });

  const bar = document.createElement('div');
  bar.className = 'actions';
  const submit = document.createElement('button');
  submit.textContent = saved && saved.passed ? 'Làm lại' : 'Nộp bài';
  const score = document.createElement('span');
  score.className = 'score';
  bar.appendChild(submit);
  bar.appendChild(score);
  wrap.appendChild(bar);

  function grade(record) {
    let correct = 0;
    st.qs.forEach((item, qi) => {
      const picked = wrap.querySelector(`input[name="s${st.id}q${qi}"]:checked`);
      const chosen = picked ? Number(picked.value) : -1;
      const optEls = wrap.querySelectorAll('.opts')[qi].querySelectorAll('.opt');
      optEls[item.a].classList.add('right');
      if (chosen !== item.a) {
        if (chosen >= 0) optEls[chosen].classList.add('wrong');
      } else correct++;
      wrap.querySelectorAll('.why')[qi].classList.add('show');
      optEls.forEach(o => o.querySelector('input').disabled = true);
    });
    score.textContent = correct + '/5' + (correct >= PASS ? ' · qua chặng' : ' · cần 4/5');
    if (correct >= PASS) {
      submit.textContent = 'Sang chặng sau';
      submit.onclick = () => { render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    } else {
      submit.textContent = 'Làm lại';
      submit.onclick = () => location.reload();
    }
    if (record) {
      progress[st.id] = { passed: correct >= PASS, score: correct };
      store.write(progress);
      updateTop();
    }
  }

  if (saved && saved.passed) {
    // đã qua: hiện đáp án đúng để ôn, không cho ghi đè điểm
    st.qs.forEach((item, qi) => {
      const optEls = wrap.querySelectorAll('.opts')[qi].querySelectorAll('.opt');
      optEls[item.a].classList.add('right');
      optEls.forEach(o => o.querySelector('input').disabled = true);
      wrap.querySelectorAll('.why')[qi].classList.add('show');
    });
    score.textContent = saved.score + '/5 · đã qua';
    submit.textContent = 'Làm lại chặng này';
    submit.onclick = () => {
      delete progress[st.id];
      store.write(progress);
      render();
    };
    return wrap;
  }

  submit.onclick = () => {
    const any = st.qs.some((item, qi) =>
      wrap.querySelector(`input[name="s${st.id}q${qi}"]:checked`));
    if (!any) { score.textContent = 'Chọn đáp án trước khi nộp.'; return; }
    grade(true);
  };
  return wrap;
}

document.getElementById('reset').onclick = () => {
  if (!confirm('Xóa toàn bộ tiến độ 12 chặng?')) return;
  progress = {};
  store.write(progress);
  render();
};

render();
</script>
